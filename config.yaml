data:
  seed: 42                      # RNG seed — same seed gives identical data
  days: 30                      # number of days to generate
  sample_rate_seconds: 60       # seconds between samples (60 = one per minute)
  start: "2026-01-01 00:00:00"  # timestamp of the first sample
  output: data/sensors.csv      # output path, relative to repo root

  baseline:
    phi: 0.999                  # pull-back toward the mean; near 1 = slow return
    

  sensors:
    - id: PMP-01                # sensor identifier, becomes the column name
      type: pump_temperature    # what it measures — used for filtering in stage 3
      unit: C                   # unit of measurement, documentation only
      mean: 65.0                # normal operating value
      noise_std: 1.2            # spread of the fast measurement noise
      daily_amp: 2.0            # amplitude of the 24-hour cycle
      slow_std: 0.02            # step size of the slow drift           

    - id: MTR-03
      type: motor_vibration
      unit: mm/s
      mean: 2.1
      noise_std: 0.3
      daily_amp: 0.3
      slow_std: 0.005

    - id: TR-114
      type: oil_temperature
      unit: C
      mean: 55.0
      noise_std: 0.8
      daily_amp: 4.0
      slow_std: 0.0125


faults:
  output: data/faults.csv       # ground truth, never read by the detector
  seed: 1337                    # separate from the baseline seed

  injections:
    # --- spikes ---
    - sensor: PMP-01            # spike — sensor glitch, easy case
      type: spike
      start: "2026-01-03 14:22:00"
      duration_minutes: 2
      magnitude: 8.5
    
    - sensor: PMP-01 
      type: spike
      start: "2026-01-03 16:22:00" 
      duration_minutes: 2 
      magnitude: 8.5
    
    - sensor: TR-114
      type: spike
      start: "2026-01-09 08:15:00"
      duration_minutes: 1
      magnitude: 6.0
    
    - sensor: MTR-03
      type: spike
      start: "2026-01-21 17:40:00"
      duration_minutes: 3
      magnitude: 1.1

    # --- drift ---
    - sensor: PMP-01            # drift — bearing heating up, the hard case
      type: drift
      start: "2026-01-07 02:00:00"
      duration_minutes: 360
      recovery_minutes: 180
      magnitude: 5.0
    
    - sensor: PMP-01
      type: drift
      start: "2026-01-13 10:00:00"
      duration_minutes: 360
      recovery_minutes: 180
      magnitude: 3.0
    
    - sensor: TR-114
      type: drift
      start: "2026-01-18 20:00:00"
      duration_minutes: 480
      recovery_minutes: 240
      magnitude: 6.0
    
    - sensor: MTR-03
      type: drift
      start: "2026-01-25 04:00:00"
      duration_minutes: 300
      recovery_minutes: 150
      magnitude: 0.5

    # --- variance ---
    - sensor: MTR-03            # variance — developing imbalance
      type: variance
      start: "2026-01-11 06:00:00"
      duration_minutes: 720
      magnitude: 2.0            # multiplier of the sensor's noise_std
    
    - sensor: MTR-03
      type: variance
      start: "2026-01-13 06:00:00"
      duration_minutes: 720
      magnitude: 2.0
    
    - sensor: PMP-01
      type: variance
      start: "2026-01-23 09:00:00"
      duration_minutes: 600
      magnitude: 2.5
    
    - sensor: TR-114
      type: variance
      start: "2026-01-28 12:00:00"
      duration_minutes: 480
      magnitude: 1.5

    # --- flatline ---
    - sensor: TR-114            # flatline — sensor stopped updating
      type: flatline
      start: "2026-01-15 19:00:00"
      duration_minutes: 240
      magnitude: 0.0            # not applicable, kept for a uniform schema
    
    - sensor: TR-114
      type: flatline
      start: "2026-01-16 21:00:00"
      duration_minutes: 240
      magnitude: 0.0
    
    - sensor: PMP-01
      type: flatline
      start: "2026-01-20 03:00:00"
      duration_minutes: 120
      magnitude: 0.0
    
    - sensor: MTR-03
      type: flatline
      start: "2026-01-27 22:00:00"
      duration_minutes: 90
      magnitude: 0.0

detection:
  output: data/detections.csv   # detector output, generated
  alarm_gap_minutes: 30         # flags closer than this on one sensor = same alarm

  zscore:
    window: 120                 # samples in the rolling window (2 hours)
    threshold: 3.0              # z-score above this counts as an anomaly
    min_periods: 60             # minimum samples before producing a score