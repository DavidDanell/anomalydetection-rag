data:
  seed: 42                      # RNG seed — same seed gives identical data
  days: 30                      # number of days to generate
  sample_rate_seconds: 60       # seconds between samples (60 = one per minute)
  start: "2026-01-01 00:00:00"  # timestamp of the first sample
  output: data/sensors.csv      # output path, relative to repo root

  baseline:
    phi: 0.999                  # pull-back toward the mean; near 1 = slow return
    

  sensors:
    - id: PMP-01                # sensor identifier, becomes the column name
      type: pump_temperature    # what it measures — used for filtering in stage 3
      unit: C                   # unit of measurement, documentation only
      mean: 65.0                # normal operating value
      noise_std: 1.2            # spread of the fast measurement noise
      daily_amp: 2.0            # amplitude of the 24-hour cycle
      slow_std: 0.02            # step size of the slow drift           

    - id: MTR-03
      type: motor_vibration
      unit: mm/s
      mean: 2.1
      noise_std: 0.3
      daily_amp: 0.3
      slow_std: 0.005

    - id: TR-114
      type: oil_temperature
      unit: C
      mean: 55.0
      noise_std: 0.8
      daily_amp: 4.0
      slow_std: 0.0125


faults:
  output: data/faults.csv       # ground truth, never read by the detector
  seed: 1337                    # separate from the baseline seed

  injections:
    - sensor: PMP-01            # spike — sensor glitch, easy case
      type: spike
      start: "2026-01-03 14:22:00"
      duration_minutes: 2
      magnitude: 8.5

    - sensor: PMP-01            # drift — bearing heating up, the hard case
      type: drift
      start: "2026-01-07 02:00:00"
      duration_minutes: 360
      recovery_minutes: 180
      magnitude: 5.0

    - sensor: MTR-03            # variance — developing imbalance
      type: variance
      start: "2026-01-11 06:00:00"
      duration_minutes: 720
      magnitude: 2            # multiplier of the sensor's noise_std

    - sensor: TR-114            # flatline — sensor stopped updating
      type: flatline
      start: "2026-01-15 19:00:00"
      duration_minutes: 240
      magnitude: 0.0            # not applicable, kept for a uniform schema